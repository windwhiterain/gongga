[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server", "crates/cli", "crates/tui", "crates/bridge", "crates/bundle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["gongga contributors"]

# In-workspace names are the un-prefixed crate names; the publish name is prefixed.
[workspace.dependencies]
protocol = { path = "crates/protocol", package = "gongga-protocol" }
server = { path = "crates/server", package = "gongga-server" }
cli = { path = "crates/cli", package = "gongga-cli" }
tui = { path = "crates/tui", package = "gongga-tui" }
bridge = { path = "crates/bridge", package = "gongga-bridge" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
