[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/skill",
    "crates/client",
    "crates/server",
    "crates/tui",
    "crates/bridge",
    "crates/bundle",
    "crates/console",
    "crates/lock",
    "crates/relay",
]
# `crates/bundle` is the distribution, not a library anybody links: a plain
# `cargo build`/`check`/`test` must not compile a second copy of the whole
# dependency graph into its payload. Named here so `--workspace` still reaches it.
default-members = ["crates/protocol", "crates/skill", "crates/client", "crates/console", "crates/lock", "crates/server", "crates/tui", "crates/bridge", "crates/relay"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
authors = ["gongga contributors"]

# In-workspace names are the un-prefixed crate names; the publish name is prefixed.
[workspace.dependencies]
protocol = { path = "crates/protocol", package = "gongga-protocol" }
skill = { path = "crates/skill", package = "gongga-skill" }
client = { path = "crates/client", package = "gongga-client" }
server = { path = "crates/server", package = "gongga-server" }
tui = { path = "crates/tui", package = "gongga-tui" }
bridge = { path = "crates/bridge", package = "gongga-bridge" }
console = { path = "crates/console", package = "gongga-console" }
home_lock = { path = "crates/lock", package = "gongga-lock" }
relay = { path = "crates/relay", package = "gongga-relay" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# One lookup for "is this program on PATH": the server starts a shell with it, the
# command layer runs a skill entry with it, and neither should spell Windows twice.
which = "8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
