[package]
name = "gongga-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gongga harness server library: sessions, agent loop, tools, sqlite storage"

[dependencies]
protocol = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

clap = { version = "4", features = ["derive", "wrap_help"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
which = "8"
shell-words = "1"
futures-util = "0.3"
# `del_bash` takes a pattern rather than a name: a long session invents shell
# names faster than anything can clean them up one at a time.
regex = "1"
tokio-util = "0.7"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# A job object is the only Windows primitive that means "this process and
# everything it started", which is what ending a persistent shell needs.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # Walking the parent chain: a detached job that wraps this server is its
    # parent, and adopting it would let `kill_bash` kill the server itself.
    "Win32_System_Diagnostics_ToolHelp",
] }
