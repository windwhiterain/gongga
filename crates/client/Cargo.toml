[package]
name = "gongga-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The client library: the link to a server, the command surface it publishes, and the lines a front-end draws"

# One library, one process. The library holds the command surface and the window's
# state machine; the bin is the child a UI starts and speaks JSON Lines to.
# Neither front-end keeps a second copy of what the server said.
[[bin]]
name = "gongga-client"
path = "src/main.rs"

[dependencies]
bindir = { workspace = true }
protocol = { workspace = true }
console = { workspace = true }
skill = { workspace = true }
home_lock = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "wrap_help"] }
dirs = "6"
toml = "0.8"
shell-words = "1"
# A document is wrapped here, at the width the drawing states: its rows are what a
# front-end draws, so the same answer wraps the same way in every one of them.
unicode-width = "0.2"
jsonc-parser = "0.34"

[dev-dependencies]
# The tests dial a server in-process, as `crates/server`'s own do.
