[package]
name = "gongga-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "One file that carries the programs: the head of a release, nothing else"

# No dependencies at all, on purpose: this program is the head of every
# distribution and has to build on a machine that has nothing.
[dependencies]

[dev-dependencies]
tempfile = "3"

[features]
# Builds the programs and embeds them, so the file `cargo install` gives you is
# the whole distribution. On by default, because installing one file is the
# ordinary case and a flag there is a stumble for no one's benefit: the crate is
# not in `default-members`, so the dev loop never builds it at all.
default = ["payload"]
payload = []

# The command a person types. `cargo install gongga-bundle` puts it on PATH under
# this name, and it dispatches to what it carries.
[[bin]]
name = "gongga"
path = "src/main.rs"
