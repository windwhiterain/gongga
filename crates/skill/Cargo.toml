[package]
name = "gongga-skill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "What a skill is on disk: the roots a session reads, the frontmatter, the entry"

# Directories and one header block, read by the server, the command layer and the
# bundle alike. The one dependency is the request a package's runner reads, and it is
# built here so both callers write the same bytes.
[dependencies]
serde_json = { workspace = true }
