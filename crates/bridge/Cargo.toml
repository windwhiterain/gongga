[package]
name = "gongga-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gongga IM bridge: a headless protocol client that carries one chat per session"

[[bin]]
name = "gongga-bridge"
path = "src/main.rs"

[dependencies]
protocol = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

clap = { version = "4", features = ["derive", "wrap_help"] }
dirs = "6"
toml = "0.8"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# rustls, not native-tls: the harness has no other reason to link a TLS stack,
# and a vendored one builds the same way on every Windows box.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
