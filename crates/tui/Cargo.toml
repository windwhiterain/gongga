[package]
name = "gongga-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gongga harness terminal UI: an event log plus an input line, with no knowledge of commands"

[dependencies]
anyhow = { workspace = true }
futures-util = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
