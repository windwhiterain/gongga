[package]
name = "gongga-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gongga harness terminal front-end: an event log plus an input line, with no knowledge of commands"

# The terminal is its own program now: `gongga` is the command line, in the
# crate this one depends on. What is left here is the composition root of a
# window -- the only program that needs both the command layer and a terminal.
[[bin]]
name = "gongga-tui"
path = "src/main.rs"

[dependencies]
cli = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
futures-util = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
# The input line's grammar: `/cmd` has to be split into tokens. Nothing else in
# this crate parses text, and the command layer never needs it -- argv is already
# tokenised by whoever started the process.
shell-words = "1"

[dev-dependencies]
tempfile = "3"
