[package]
name = "gongga-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gongga harness terminal front-end: an event log plus an input line, with no knowledge of commands"

# The terminal is its own program: what it shares with the command line is the
# client library and the command surface (`crates/client`), never the
# command-line program.
# What is left here is the composition root of a window.
[[bin]]
name = "gongga-tui"
path = "src/main.rs"
# The binary is `main` and nothing else: what it decides lives in the library, so
# the crate carries one test binary rather than one per target.
test = false

[dependencies]
client = { workspace = true }
anyhow = { workspace = true }
# The window's own cache on disk: one journal per window, and the versioned
# record shape a later build has to be able to refuse.
serde = { workspace = true }
# `tui.toml` is the window's own file: the harness keeps its server state in
# sqlite and its config in TOML, and this is the one client-side section.
toml = "0.8"
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
# The cover is drawn as pixels, not as cells: the crate asks the terminal which picture
# protocol it answers and falls back to half blocks for the ones that answer none.
# Default features are off because they probe for the chafa C library at build time; the
# half-block fallback they would swap in is the crate's own Rust one without them.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
# The wordmark is a bitmap font, so its letters are the same pixels on every terminal.
font8x8 = "0.3"
# 0.25.10 raises its minimum Rust above this workspace's 1.86; only the cover's PNG is decoded.
image = { version = "=0.25.9", default-features = false, features = ["png"] }
unicode-width = "0.2"
# The input line's grammar: `/cmd` has to be split into tokens. Nothing else in
# this crate parses text, and the command layer never needs it -- argv is already
# tokenised by whoever started the process.
shell-words = "1"
pulldown-cmark = { version = "0.13.6", default-features = false }
# The toast's script travels as `-EncodedCommand` wants it: UTF-16LE, base64.
base64 = "0.23"
