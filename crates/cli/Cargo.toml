[package]
name = "gongga-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gongga harness command layer: catalog, sticky arguments, wire client"

# Deliberately no rendering crate: this is the layer. Its own program is the
# `gongga` binary below -- argv in, the command's events out, no terminal in
# sight. The terminal is `crates/tui`, which depends on this crate.
[[bin]]
name = "gongga"
path = "src/bin/gongga.rs"

[dependencies]
protocol = { workspace = true }
# The server is a library and this crate is the binary that runs it. Named
# `harness` here because `cli::server` is the module that starts it.
harness = { path = "../server", package = "gongga-server" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

clap = { version = "4", features = ["derive", "wrap_help"] }
dirs = "6"
toml = "0.8"
# Completion splits the line being typed (`catalog.rs`), which is the input
# line's business -- a command that already arrived as argv is never re-split.
shell-words = "1"
# The server is started by name when nothing answers (`server.rs`), so the name
# is looked up the way a shell would.
which = "8"

[dev-dependencies]
tempfile = "3"
