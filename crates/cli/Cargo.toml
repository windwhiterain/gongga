[package]
name = "gongga-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gongga harness command layer: one command per process, its events out"

# The program, not the client. What a command line means -- the catalog, the sticky
# arguments, the link -- is `crates/link`, because the window runs the same one and
# must not link a program to get it.
[[bin]]
name = "gongga-cli"
path = "src/bin/gongga-cli.rs"
# Three lines of `main`: every test this used to carry is the library's, in
# `crates/link`, so the workspace gains no empty test binary that still links.
test = false

[dependencies]
link = { workspace = true }
console = { workspace = true }
anyhow = { workspace = true }
dirs = "6"
