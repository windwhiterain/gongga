[package]
name = "gongga-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gongga harness command layer: catalog, sticky arguments, wire client"

# Deliberately no rendering crate: this is the layer. Its own program is the
# `gongga` binary below -- argv in, the command's events out, no terminal in
# sight. The terminal is `crates/tui`, which depends on this crate.
#
# It does not depend on the harness: `serve` starts `gongga-server`, which is a
# program of its own. Depending on it was half a minute of link time for a
# command that only ever forwarded its argv.
[[bin]]
name = "gongga-cli"
path = "src/bin/gongga-cli.rs"
# Three lines of `main`: every test in this crate is the library's, so the
# workspace gains no empty test binary that still has to be linked.
test = false

[dependencies]
protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

clap = { version = "4", features = ["derive", "wrap_help"] }
dirs = "6"
toml = "0.8"
# Completion splits the line being typed (`catalog.rs`), which is the input
# line's business -- a command that already arrived as argv is never re-split.
shell-words = "1"

[dev-dependencies]
tempfile = "3"
