[package]
name = "gongga-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gongga harness command layer: catalog, sticky arguments, wire client"

# Deliberately no [[bin]] and no rendering crate: this is the layer, not a
# program. The `gongga` binary is the composition root and lives in
# `crates/tui`, which depends on this crate -- not the other way round.

[dependencies]
protocol = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

clap = { version = "4", features = ["derive", "wrap_help"] }
dirs = "6"
toml = "0.8"
# Completion splits the line being typed (`catalog.rs`), which is the input
# line's business -- a command that already arrived as argv is never re-split.
shell-words = "1"

[dev-dependencies]
tempfile = "3"
